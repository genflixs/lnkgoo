<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // ==========================================================
    // GitHub Pages SPA Redirect
    // ==========================================================
    // GitHub Pages serve 404.html untuk path yang tidak ada
    // sebagai file fisik. Kita simpan path asli ke sessionStorage,
    // lalu redirect ke / supaya app.js (index.html) bisa load
    // dan router baca path dari sessionStorage.
    //
    // PENTING: sessionStorage digunakan karena:
    //   - Persistence hanya untuk session ini (tidak bocor ke session lain)
    //   - Bisa simpan path lengkap dengan query string
    // ==========================================================

    (function() {
      var path = window.location.pathname;
      var search = window.location.search;

      // Jangan simpan jika di root atau 404.html sendiri
      if (path !== '/' && path !== '/404.html' && path !== '/404') {
        var fullPath = path + search;
        try {
          sessionStorage.setItem('spa_redirect', fullPath);
          console.log('[404] Saved redirect path:', fullPath);
        } catch (e) {
          console.warn('[404] Cannot save to sessionStorage:', e);
        }
      }

      // Redirect ke root (index.html akan handle routing)
      // Pakai replace() supaya tidak bikin history entry
      window.location.replace('/' + search);
    })();
  </script>
  <style>
    body {
      background: #1a1d29;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .text {
      color: #c8cad4;
      font-size: 0.9rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="text">Loading...</div>
  </div>
</body>
</html>
